# Builds Linux bases and publishes them, so apps can download a base the first time a project needs
# it: each build becomes a release asset (<id>-v<image version>), the catalog lists it, and the
# signed catalog is saved as an artifact for a reviewed pull request to main.
#
# Run it from Actions > "Publish Linux Base" > Run workflow on main, with base ids from
# Catalog/catalog.json. Needs the secret CATALOG_SIGNING_KEY of the environment "catalog", which
# only main may use (README.md, "Catalog"). Bases the catalog lists already are built again only
# with "rebuild": the catalog keeps one build per base, so environments created on the earlier
# build can't download it anymore.
# If a run fails after its builds, "Re-run failed jobs" publishes the same builds: a release that
# already holds a build is used again, never replaced, and builds the catalog lists already are
# left as they are.

name: Publish Linux Base

on:
  workflow_dispatch:
    inputs:
      images:
        description: Base ids from Catalog/catalog.json, separated by spaces or commas (for example debian-12-arm64)
        required: true
        type: string
      rebuild:
        description: Build bases again that are published already (environments created on the published build can't download it anymore)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds CATALOG_SIGNING_KEY; its deployment branch rule admits main only.
    environment: catalog
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
      list: ${{ steps.ids.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require complete image redistribution evidence
        env:
          LICENSE_CLEARED: ${{ vars.LINUX_IMAGE_LICENSE_CLEARED }}
        run: |
          if [ "$LICENSE_CLEARED" != true ]; then
            echo "::error::Linux image publication is blocked until guest package, license and source inventories are verified."
            exit 1
          fi
          python3 Tools/Licenses/verify.py --notices-only --require-clearance
      - name: Check the requested bases
        id: ids
        env:
          IMAGES: ${{ inputs.images }}
          REBUILD: ${{ inputs.rebuild }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Apps load the catalog from main, and releases belong to the whole repository: a run on
          # another branch would publish builds that main's catalog never lists.
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run the workflow on $DEFAULT_BRANCH, not $GITHUB_REF: apps load the catalog from there."
            exit 1
          fi
          python3 - <<'PYTHON'
          import json, os, re, sys
          sys.path.insert(0, "Tools/Catalog")
          import catalog_release
          catalog = catalog_release.load("Catalog/catalog.json")
          known = [image["id"] for image in catalog["baseImages"]]
          ids = []
          for image_id in re.split(r"[\s,]+", os.environ["IMAGES"].strip()):
              if image_id and image_id not in ids:
                  ids.append(image_id)
          unknown = [image_id for image_id in ids if image_id not in known]
          if not ids or unknown:
              problem = f"Unknown bases: {', '.join(unknown)}." if unknown else "No base given."
              print(f"::error::{problem} The catalog lists {', '.join(known)}.")
              sys.exit(1)
          # Published bases only with rebuild, before hours of building.
          problems = []
          for image_id in ids:
              try:
                  catalog_release.next_version(catalog, image_id, os.environ["REBUILD"] == "true")
              except catalog_release.CatalogError as error:
                  problems.append(str(error))
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ids={json.dumps(ids)}\nlist={' '.join(ids)}\n")
          print("Bases:", " ".join(ids))
          PYTHON
      - name: Check the signing key
        # Before hours of building: without the right key the catalog can't be published.
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          if [ -z "$CATALOG_SIGNING_KEY" ]; then
            echo "::error::The secret CATALOG_SIGNING_KEY of the environment catalog is missing (Settings > Environments > catalog; README.md, Catalog)."
            exit 1
          fi
          Tools/Catalog/sign-catalog.sh --check-key

  build:
    name: Build ${{ matrix.id }}
    needs: plan
    # Arm64 like the guest: with KVM if the runner offers it, else emulated (TCG), which takes hours.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    env:
      IMAGE: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "/dev/kvm is available: the guest runs with KVM."
          else
            echo "::notice title=No KVM::This runner has no /dev/kvm; $IMAGE is built emulated (TCG), which takes hours."
          fi
          nproc
          free -h
          df -h .
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 qemu-utils xorriso zstd
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Tools/GuestImage/build_image.py "$IMAGE"
      - name: Keep the image for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.id }}
          path: |
            Tools/GuestImage/build/${{ matrix.id }}/${{ matrix.id }}.runfernimage
            Tools/GuestImage/build/${{ matrix.id }}/${{ matrix.id }}.sha256
            Tools/GuestImage/build/${{ matrix.id }}/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 3
          # The disk inside is compressed qcow2 already.
          compression-level: 0
          overwrite: true
      - name: Keep the console log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-${{ matrix.id }}
          path: Tools/GuestImage/build/${{ matrix.id }}/work/console.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  publish:
    name: Publish
    # Runs only if every build succeeded (needs' default), so a catalog never lists half a request.
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: catalog
    permissions:
      contents: write
    # One publish at a time in the whole repository: release tags and the catalog are shared, and
    # each publish continues from the catalog the previous one pushed. queue: max lets every
    # waiting publish wait; by default GitHub cancels all but the newest, and their builds would
    # go unpublished. (actionlint 1.7.12 doesn't know the key yet; GitHub does.)
    concurrency:
      group: publish-linux-base
      cancel-in-progress: false
    env:
      IDS: ${{ needs.plan.outputs.list }}
      REBUILD: ${{ inputs.rebuild }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The branch as it is now, not the commit the run started on: image versions continue
          # from the newest catalog.
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the signing key
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          if [ -z "$CATALOG_SIGNING_KEY" ]; then
            echo "::error::The secret CATALOG_SIGNING_KEY of the environment catalog is missing (Settings > Environments > catalog; README.md, Catalog)."
            exit 1
          fi
          Tools/Catalog/sign-catalog.sh --check-key
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Publish the images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rebuild=()
          if [ "$REBUILD" = true ]; then
            rebuild=(--rebuild)
          fi
          for id in $IDS; do
            mkdir -p "Tools/GuestImage/build/$id"
            mv "$RUNNER_TEMP/images/$id".* "Tools/GuestImage/build/$id/"
            Tools/Catalog/publish-image.sh "${rebuild[@]}" "$id"
          done
      - name: Sign the catalog
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          # Unchanged when the catalog lists every build already, as after a re-run of this job
          # whose first attempt pushed: then there's nothing to sign or push.
          if git diff --quiet -- Catalog/catalog.json; then
            echo "The catalog lists these builds already."
            exit 0
          fi
          python3 Tools/Catalog/catalog_release.py finish
          Tools/Catalog/sign-catalog.sh
      - name: Verify the signed catalog
        run: Tools/Catalog/verify-catalog.sh
      - name: Save the catalog for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-catalog
          path: |
            Catalog/catalog.json
            Catalog/catalog.json.sig
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        run: |
          {
            echo "### Catalog version $(jq .catalogVersion Catalog/catalog.json) on $BRANCH"
            echo
            echo "Download signed-catalog and submit both files in a pull request to main. Main is never bypassed."
            echo
            echo "| Base | Image version | Size | Download |"
            echo "| --- | --- | --- | --- |"
            for id in $IDS; do
              jq -r --arg id "$id" '.baseImages[] | select(.id == $id)
                | "| \(.id) | \(.catalogVersion) | \((.downloadSizeBytes / 1e5 | round) / 10) MB | \(.source.url) |"' Catalog/catalog.json
            done
          } >> "$GITHUB_STEP_SUMMARY"
