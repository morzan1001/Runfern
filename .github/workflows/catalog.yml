# Guards the signed catalog. Apps load Catalog/catalog.json only if its signature matches the
# publisher key built into the app and fall back to an empty catalog otherwise, so every change to
# the catalog, its tools, or the app's key is checked before it reaches main. Apps also install only
# a catalog whose catalogVersion is higher than theirs, so a changed catalog must raise it.
#
# GITHUB_TOKEN-created catalog PRs do not trigger workflows; the protected publisher explicitly
# dispatches this workflow on its signed commit and supplies the main base for version comparison.

name: Catalog

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      previous:
        description: Main commit used as the generated catalog PR base
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The history holds the previous catalog for the version check.
          fetch-depth: 0
      - name: Check the catalog and its signature
        run: Tools/Catalog/verify-catalog.sh
      - name: Test catalog publishing invariants
        run: |
          python3 -m unittest discover -s Tools/Catalog -p 'test_*.py'
          python3 -m unittest discover -s Tools/GuestImage -p 'test_*.py'
      - name: Verify license notice integrity
        run: |
          python3 Tools/Licenses/verify.py --notices-only
          python3 -m unittest discover -s Tools/Licenses -p 'test_*.py'
      - name: Check the release version
        run: |
          version="$(sed -n 's/^MARKETING_VERSION = //p' Version.xcconfig)"
          bash Tools/Build/check-version.sh "v$version"
      - name: Check that a changed catalog has a higher version
        env:
          # The pull request's base, or the branch before this push (zeros for a new branch).
          PREVIOUS: ${{ github.event.pull_request.base.sha || github.event.before || inputs.previous }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            current_main="$(git rev-parse FETCH_HEAD)"
            if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$current_main" ]; then
              echo "::error::Main advanced since this catalog PR was prepared; rerun the publisher."
              exit 1
            fi
            PREVIOUS="$current_main"
          fi
          if [ -z "$PREVIOUS" ] || ! git cat-file -e "$PREVIOUS:Catalog/catalog.json" 2>/dev/null; then
            echo "No earlier catalog to compare with."
            exit 0
          fi
          git show "$PREVIOUS:Catalog/catalog.json" > "$RUNNER_TEMP/previous-catalog.json"
          python3 Tools/Catalog/catalog_release.py newer-than "$RUNNER_TEMP/previous-catalog.json"
