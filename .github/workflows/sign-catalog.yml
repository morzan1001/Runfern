name: Sign Catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-catalog
  cancel-in-progress: false

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: catalog
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Raise the catalog version and sign
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          Tools/Catalog/sign-catalog.sh --check-key
          python3 Tools/Catalog/catalog_release.py finish
          Tools/Catalog/sign-catalog.sh
          Tools/Catalog/verify-catalog.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-catalog
          path: |
            Catalog/catalog.json
            Catalog/catalog.json.sig
          if-no-files-found: error
          retention-days: 30
