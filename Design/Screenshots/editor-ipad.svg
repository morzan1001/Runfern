      <text x="373" y="232" fill="#858585" text-anchor="end">1</text>
      <text x="411" y="232" fill="#c586c0">from</text><text x="451" y="232" fill="#d4d4d4"> sensors </text><text x="524" y="232" fill="#c586c0">import</text><text x="580" y="232" fill="#d4d4d4"> read_all</text>
      <text x="373" y="265" fill="#858585" text-anchor="end">2</text>
      <text x="373" y="298" fill="#858585" text-anchor="end">3</text>
      <text x="411" y="298" fill="#569cd6">def</text><text x="444" y="298" fill="#dcdcaa"> main</text><text x="490" y="298" fill="#d4d4d4">():</text>
      <text x="373" y="331" fill="#858585" text-anchor="end">4</text>
      <text x="436" y="331" fill="#9cdcfe"> readings</text><text x="510" y="331" fill="#d4d4d4"> = </text><text x="538" y="331" fill="#dcdcaa">read_all</text><text x="603" y="331" fill="#d4d4d4">()</text>
      <text x="373" y="364" fill="#858585" text-anchor="end">5</text>
      <text x="436" y="364" fill="#c586c0">for</text><text x="467" y="364" fill="#9cdcfe"> name</text><text x="510" y="364" fill="#c586c0">, value</text><text x="566" y="364" fill="#c586c0"> in</text><text x="588" y="364" fill="#9cdcfe"> readings</text><text x="662" y="364" fill="#d4d4d4">:</text>
      <text x="373" y="397" fill="#858585" text-anchor="end">6</text>
      <text x="461" y="397" fill="#dcdcaa"> print</text><text x="512" y="397" fill="#d4d4d4">(</text><text x="520" y="397" fill="#ce9178">f"{name}: {value:.1f}"</text><text x="708" y="397" fill="#d4d4d4">)</text>
      <text x="373" y="430" fill="#858585" text-anchor="end">7</text>
      <text x="373" y="463" fill="#858585" text-anchor="end">8</text>
      <text x="411" y="463" fill="#569cd6">if</text><text x="430" y="463" fill="#d4d4d4"> __name__ == </text><text x="543" y="463" fill="#ce9178">"__main__"</text><text x="636" y="463" fill="#d4d4d4">:</text>
      <text x="373" y="496" fill="#858585" text-anchor="end">9</text>
      <text x="436" y="496" fill="#dcdcaa"> main</text><text x="482" y="496" fill="#d4d4d4">()</text>
    </g>
    <rect x="356" y="584" width="986" height="1" fill="#414141"/>
    <rect x="356" y="585" width="986" height="259" fill="#1e1e1e"/>
