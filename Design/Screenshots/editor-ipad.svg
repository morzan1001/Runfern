    <text x="378" y="650" fill="#4ec9b0" font-family="ui-monospace, monospace" font-size="14">runfern</text>
    <text x="440" y="650" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="14"> ~/weather-station $ python src/main.py</text>
    <text x="378" y="679" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="14">temperature: 21.4</text>
    <text x="378" y="705" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="14">humidity: 48.2</text>
    <text x="378" y="731" fill="#4ec9b0" font-family="ui-monospace, monospace" font-size="14">runfern</text>
    <text x="440" y="731" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="14"> ~/weather-station $ <tspan fill="#d4d4d4">▍</tspan></text>
    <rect x="98" y="844" width="1244" height="46" fill="#007acc"/>
    <text x="116" y="873" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Runfern</text>
    <text x="206" y="873" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Linux · Debian 12</text>
    <text x="1257" y="873" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">Python 3.15</text>
