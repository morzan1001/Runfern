<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">Runfern editor on iPad</title>
  <desc id="description">Illustrative iPad mockup showing the VS Code-based editor inside Runfern.</desc>
  <defs>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#343943"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#111827" flood-opacity=".28"/>
    </filter>
    <clipPath id="screen">
      <rect x="98" y="70" width="1244" height="820" rx="34"/>
    </clipPath>
  </defs>
  <rect width="1440" height="960" fill="#f3f5f9"/>
